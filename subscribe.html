<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abonelik</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .subscribe-box {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 400px;
      text-align: center;
    }

    .subscribe-box h1 {
      margin-bottom: 15px;
      color: #333;
    }

    .subscribe-box p {
      margin-bottom: 25px;
      color: #555;
    }

    .subscribe-box a {
      display: inline-block;
      padding: 12px 20px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }

    .subscribe-box a:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="subscribe-box">
    <h1>Abonelik geçersiz</h1>
    <p>Yönetici paneline erişmek için abonelik ücreti ödemeniz gerekiyor.</p>
    <a href="mailto:master_work@outlook.com?subject=Panel%20aboneliği">Destek ile iletişime geçin</a>
  </div>
</body>
</html>
