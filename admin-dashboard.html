<!DOCTYPE html>
<html lang="tr">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Yönetici Paneli - ShopManager</title>
	<link rel="stylesheet" href="style.css" />
</head>

<body>
	<header>
		<h1>Yönetici Paneli</h1>
		<button id="logoutBtn">Çıkış Yap</button>
	</header>

	<main>
		<form id="addOrderForm">
			<h2>Siparişi Elle Ekle</h2>
			<input id="clientEmail" type="email" name="email" placeholder="Müşteri Emaili" required />
			<input id="product" type="text" name="product" placeholder="Ürün Açıklaması" required />
			<input id="clientName" type="text" name="clientName" placeholder="Müşteri Adı" />
			<input id="deliveryAdres" type="text" name="deliveryAdres" placeholder="Teslimat Adresi" />
			<input id="price" type="text" name="price" placeholder="Fiyat" />
			<input id="status" type="text" name="status" placeholder="Durum (örneğin: işlendi)" />
			<button type="submit">Sipariş Ekle</button>
		</form>

		<div id="ordersContainer">
			<h2>Tüm Müşteri Siparişleri</h2>
			<p>Siparişler Yükleniyor...</p>
		</div>
	</main>

	<script type="module" src="admin-dashboard.js"></script>
</body>

</html>
